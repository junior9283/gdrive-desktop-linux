[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-only"
repository = "https://github.com/junior9283/gdrive-desktop-linux"

[workspace.dependencies]
gdl-common = { path = "crates/gdl-common" }
gdl-store = { path = "crates/gdl-store" }
gdl-drive = { path = "crates/gdl-drive" }
gdl-fake-drive = { path = "crates/gdl-fake-drive" }
gdl-engine = { path = "crates/gdl-engine" }
gdl-fs = { path = "crates/gdl-fs" }
gdl-daemon = { path = "crates/gdl-daemon" }
gdl-ipc = { path = "crates/gdl-ipc" }
gdl-tray = { path = "crates/gdl-tray" }
sha2 = "0.11"
rusqlite = { version = "0.41", features = ["bundled", "fallible_uint", "functions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-util = "0.7"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "net", "sync", "time", "fs", "io-util"] }
axum = "0.8"
reqwest = { version = "0.13", features = ["json", "form", "query", "stream", "socks"] }
url = "2"
rand = "0.9"
base64 = "0.22"
md-5 = "0.11"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
bytes = "1"
rustix = { version = "1.1", features = ["fs"] }
futures-util = "0.3"
fuser = "0.18"
walkdir = "2"
oo7 = { version = "0.6", default-features = false, features = ["tokio", "native_crypto"] }
async-trait = "0.1"
toml = "1"
thiserror = "2"
tracing = "0.1"
tempfile = "3"
fluent-bundle = "0.16"
unic-langid = "0.9"
zbus = { version = "5.19", default-features = false, features = ["tokio", "p2p"] }
clap = { version = "4.6", features = ["derive"] }
regex = "1.12"
tracing-subscriber = "0.3"
ksni = "0.3.7"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
