[package]
name = "gdl-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "gdrive-desktop-linuxd"
path = "src/main.rs"

[dependencies]
futures-util.workspace = true
fuser.workspace = true
gdl-common.workspace = true
gdl-drive.workspace = true
gdl-engine.workspace = true
gdl-folders.workspace = true
gdl-fs.workspace = true
gdl-ipc.workspace = true
gdl-store.workspace = true
regex.workspace = true
rustix = { workspace = true, features = ["fs", "process", "system"] }
ron.workspace = true
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tokio = { workspace = true, features = ["signal"] }
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
zbus.workspace = true
tar.workspace = true
flate2.workspace = true

[features]
# O UDisks2 falso, para o serviço dos testes de ponta a ponta (`examples/e2e-daemon.rs`).
testing = []

[[example]]
name = "e2e-daemon"
required-features = ["testing"]

[dev-dependencies]
gdl-fake-drive.workspace = true
