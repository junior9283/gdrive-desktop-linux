# Os pacotes .deb, .rpm e Arch (scripts/package.sh acrescenta a lista de arquivos). As dependências
# são só o que os programas carregam (a janela: WebKitGTK e D-Bus) e o FUSE 3 da montagem; no .rpm
# vão pelo nome da biblioteca, que serve ao Fedora e ao openSUSE. Os bindings Python do menu do
# botão direito no Nautilus, Nemo, Caja e Thunar são só sugeridos: o apt instalaria recomendações.
name: gdrive-desktop-linux
arch: amd64
platform: linux
version: ${VERSION}
section: net
priority: optional
maintainer: junior9283 <eng.geraldo@outlook.com>
vendor: junior9283
homepage: https://github.com/junior9283/gdrive-desktop-linux
license: GPL-3.0-only
description: |-
  Cliente não oficial do Google Drive para Linux.
  Monta o Drive como uma pasta, com arquivos sob demanda, arquivos offline, bandeja e janela de
  status, como o Drive para computador.
overrides:
  deb:
    depends:
      - fuse3
      - libwebkit2gtk-4.1-0
      - libdbus-1-3
    # O menu do botão direito em cada gerenciador GTK (sem eles, só não aparece).
    suggests:
      - python3-nautilus
      - python3-nemo
      - python-caja
      - thunarx-python
  rpm:
    depends:
      - fuse3
      - libwebkit2gtk-4.1.so.0()(64bit)
      - libdbus-1.so.3()(64bit)
    suggests:
      - nautilus-python
      - nemo-python
      - python3-caja
      - thunarx-python
  archlinux:
    depends:
      - fuse3
      - webkit2gtk-4.1
      - dbus
