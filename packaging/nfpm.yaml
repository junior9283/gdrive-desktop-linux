# Os pacotes .deb, .rpm e Arch (scripts/package.sh acrescenta a lista de arquivos). As dependências
# são só o que os programas carregam (a janela: WebKitGTK e D-Bus) e o FUSE 3 da montagem; no .rpm
# vão pelo nome da biblioteca, que serve ao Fedora e ao openSUSE.
name: gdrive-desktop-linux
arch: amd64
platform: linux
version: ${VERSION}
section: net
priority: optional
maintainer: junior9283 <eng.geraldo@outlook.com>
vendor: junior9283
homepage: https://github.com/junior9283/gdrive-desktop-linux
license: GPL-3.0-only
description: |-
  Cliente não oficial do Google Drive para Linux.
  Monta o Drive como uma pasta, com arquivos sob demanda, arquivos offline, bandeja e janela de
  status, como o Drive para computador.
overrides:
  deb:
    depends:
      - fuse3
      - libwebkit2gtk-4.1-0
      - libdbus-1-3
  rpm:
    depends:
      - fuse3
      - libwebkit2gtk-4.1.so.0()(64bit)
      - libdbus-1.so.3()(64bit)
  archlinux:
    depends:
      - fuse3
      - webkit2gtk-4.1
      - dbus
