<!-- Barramento de sessão dos testes de ponta a ponta: sem ativação de serviços, para nada do
     sistema (portais, gerenciadores) subir no meio do teste. -->
<busconfig>
  <type>session</type>
  <listen>unix:tmpdir=/tmp</listen>
  <policy context="default">
    <allow send_destination="*"/>
    <allow receive_sender="*"/>
    <allow own="*"/>
  </policy>
</busconfig>
